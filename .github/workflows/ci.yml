name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia 1.13.4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.13.4'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Test
        env:
          JULIA_NUM_THREADS: '2'
          JULIA_NUM_PRECOMPILE_TASKS: '2'
          CUDA_VISIBLE_DEVICES: ''
        run: >-
          julia --startup-file=no --project --check-bounds=yes --depwarn=error
          -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--check-bounds=yes", "--depwarn=error"])'
