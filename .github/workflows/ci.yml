name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia 1.13
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Test
        env:
          JULIA_NUM_THREADS: '2'
          JULIA_NUM_PRECOMPILE_TASKS: '2'
          CUDA_VISIBLE_DEVICES: ''
        run: >-
          julia --startup-file=no --project --check-bounds=yes --depwarn=error
          -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--check-bounds=yes", "--depwarn=error"])'
